  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green:      #2C4C3B;   /* тёмно-зелёный текст */
    --terracotta: #8B4513;   /* тёплая подпись */
    --paper:      #FAF8F5;   /* бумажная карточка */
    --page-bg:    #EAE6DF;   /* фон страницы */
    /* кривые отклика (скилл Эмиля Ковальски): резкий старт, мягкий финиш */
    --ease-out:   cubic-bezier(.23, 1, .32, 1);
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--page-bg);
    font-family: 'Golos Text', -apple-system, 'Segoe UI', sans-serif;
    color: var(--green);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px 48px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 1px solid #E0DCD2;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(44,76,59,0.14);
    position: relative;
  }

  /* ── Шапка: фон из карт таро (Таро эстетика.jpg), выгнутая нижняя кромка ── */
  .header {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 8px;
  }
  .header-bg {
    width: 100%;
    height: 190px;
    overflow: hidden;
    /* Мягкая эллиптическая кромка снизу — как в макете */
    clip-path: ellipse(140% 100% at 50% 0%);
    background-color: #1b1712;
  }
  .header-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }
  /* лёгкое затемнение краёв фона, чтобы белый аватар читался */
  .header-bg::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 190px;
    clip-path: ellipse(140% 100% at 50% 0%);
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 45%);
    pointer-events: none;
  }

  /* ── Аватар ── */
  .avatar {
    margin-top: -64px;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    padding: 6px;
    background: var(--paper);
    box-shadow: 0 6px 16px rgba(44,76,59,0.22);
    position: relative;
    z-index: 2;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }

  /* ── Имя + подпись ── */
  .name {
    margin-top: 14px;
    font-family: 'Vollkorn', Georgia, 'Times New Roman', serif;
    font-size: 31px;
    font-weight: 600;
    letter-spacing: -0.01em;   /* крупный текст — чуть плотнее, мелкий — шире */
    text-align: center;
    padding: 0 16px;
  }
  .subtitle {
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--terracotta);
    text-align: center;
  }

  /* ── Секции по категориям ── */
  .links {
    padding: 18px 22px 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cat {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
    margin-bottom: 4px;
  }
  .cat:first-child { margin-top: 8px; }
  .cat .cat-logo {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat .cat-logo svg { width: 100%; height: 100%; display: block; }
  .cat h2 {
    font-family: 'Vollkorn', Georgia, 'Times New Roman', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--green);
    opacity: 0.92;
  }

  /* ── Кнопка-ссылка ── */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px 18px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(44,76,59,0.07);
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(44,76,59,0.08);
    color: var(--green);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    text-decoration: none;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
    /* отпускание — 160 мс по сильной кривой; само нажатие ещё резче (ниже) */
    transition: transform 160ms var(--ease-out), background 0.2s ease, box-shadow 0.2s ease;
  }
  /* наведение — только для мыши: на телефоне оно «залипает» после тапа */
  @media (hover: hover) and (pointer: fine) {
    .btn:hover { background: rgba(255,255,255,0.95); box-shadow: 0 4px 14px rgba(44,76,59,0.12); }
  }
  /* отклик на касание мгновенный — кнопка «услышала» палец */
  .btn:active { transform: scale(0.97); background: rgba(255,255,255,1); transition-duration: 100ms; }

  /* ── Появление списка каскадом: 30 мс между кнопками, ничего не блокирует ── */
  /* fill-mode backwards: после появления кадры отпускают элемент,
     иначе они задавят отклик кнопки на нажатие */
  .links > * { animation: rise 320ms var(--ease-out) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .links > :nth-child(1) { animation-delay: 0ms; }
  .links > :nth-child(2) { animation-delay: 30ms; }
  .links > :nth-child(3) { animation-delay: 60ms; }
  .links > :nth-child(4) { animation-delay: 90ms; }
  .links > :nth-child(5) { animation-delay: 120ms; }
  .links > :nth-child(6) { animation-delay: 150ms; }
  .links > :nth-child(7) { animation-delay: 180ms; }
  .links > :nth-child(8) { animation-delay: 210ms; }
  .links > :nth-child(9) { animation-delay: 240ms; }
  .links > :nth-child(10) { animation-delay: 270ms; }
  .links > :nth-child(11) { animation-delay: 300ms; }
  .links > :nth-child(12) { animation-delay: 330ms; }
  .links > :nth-child(13) { animation-delay: 360ms; }
  .links > :nth-child(14) { animation-delay: 390ms; }
  .links > :nth-child(15) { animation-delay: 400ms; }
  .links > :nth-child(16) { animation-delay: 400ms; }
  .links > :nth-child(17) { animation-delay: 400ms; }
  .links > :nth-child(18) { animation-delay: 400ms; }
  .links > :nth-child(19) { animation-delay: 400ms; }
  .links > :nth-child(20) { animation-delay: 400ms; }
  .links > :nth-child(21) { animation-delay: 400ms; }
  .links > :nth-child(22) { animation-delay: 400ms; }
  .links > :nth-child(23) { animation-delay: 400ms; }
  .links > :nth-child(24) { animation-delay: 400ms; }

  /* ── Настройка «меньше движения» ── */
  @media (prefers-reduced-motion: reduce) {
    .links > * { animation: fade 200ms ease backwards; }
    @keyframes fade { from { opacity: 0; } }
    .btn, .btn:active { transition-duration: 0ms; transform: none; }
  }
</style>

        var opened = false;
        var onHide = function () { opened = true; };
        document.addEventListener('visibilitychange', onHide);
        window.location.href = app;
        setTimeout(function () {
          document.removeEventListener('visibilitychange', onHide);
          if (!opened && document.visibilityState === 'visible') {
            window.location.href = web;
          }
        }, 800);
      });
    });
  </script>
</body>
</html>
